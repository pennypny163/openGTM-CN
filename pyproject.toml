[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opengtm"
version = "0.2.0"
description = "AI驱动的GTM自动化：线索发现、ICP评分、AEO健康检查、内容流水线。基于腾讯混元大模型。"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "OpenGTM Team" }
]
requires-python = ">=3.9"
keywords = ["gtm", "线索发现", "aeo", "答案引擎优化", "外展", "seo", "ai自动化", "icp评分", "冷触达"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
    "requests>=2.31.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
opengtm = "opengtm.cli:main"

[project.urls]
Homepage = "https://github.com/buildingopen/opengtm"
Repository = "https://github.com/buildingopen/opengtm"
Issues = "https://github.com/buildingopen/opengtm/issues"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where = ["."]
include = ["opengtm*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
